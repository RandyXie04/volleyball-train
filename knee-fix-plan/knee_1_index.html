<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>膝蓋強化課表（冠狀＋矢狀面）</title>
<style>
:root{--bg:#F7F5F0;--bg2:#fff;--ink:#1F2A24;--soft:#5B6961;--line:#DCE1DB;--acc:#2F6B4F;--accs:#E4EFE7;--warn:#B4552E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151815;--bg2:#1D211D;--ink:#E9ECE8;--soft:#9AA69C;--line:#333A33;--acc:#6FC99A;--accs:#223228;--warn:#E08A5E}}
:root[data-theme="dark"]{--bg:#151815;--bg2:#1D211D;--ink:#E9ECE8;--soft:#9AA69C;--line:#333A33;--acc:#6FC99A;--accs:#223228;--warn:#E08A5E}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--soft);font-size:.86rem;margin:0}
.picker{display:flex;flex-direction:column;gap:10px;margin:18px 0 20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:64px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--soft);font-size:.92rem;cursor:pointer;user-select:none}
.chip.day{min-width:44px;flex:1 1 12%}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 2px}
.tag{display:inline-block;font-size:.76rem;color:var(--acc);background:var(--accs);padding:2px 9px;border-radius:999px;margin-bottom:10px}
.tag.w{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--bg2))}
.note{color:var(--soft);font-size:.86rem;margin:0 0 12px}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:none}
.eh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.en{font-weight:600;font-size:.98rem}
.ed{color:var(--soft);font-size:.84rem;text-align:right}
details{margin-top:6px}
summary{cursor:pointer;font-size:.82rem;color:var(--acc);list-style:none;display:flex;align-items:center;gap:4px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:.72rem;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.desc{margin:8px 0 0;padding:10px 12px;background:var(--accs);border-radius:8px;font-size:.86rem;line-height:1.7}
.tl{margin:0 0 10px;padding-left:1.1em;font-size:.92rem}
.tl li{margin-bottom:6px}
footer{color:var(--soft);font-size:.78rem;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>膝蓋強化課表（冠狀＋矢狀面）</h1>
  <p class="sub">每日下班後 35–40 分鐘｜點選週次與日期，動作說明點擊展開</p>
  <div class="picker"><div class="row" id="wk"></div><div class="row" id="dy"></div></div>
  <div id="out"></div>
  <footer>訓練中疼痛 &gt; 3 分立即停止；隔日晨起單腳蹲疼痛較前一天增加 ≥ 2 分，當天退階</footer>
</div>
<script>
const DAYS=["一","二","三","四","五","六","日"];
const L={
wall:["靠牆靜蹲","背貼牆、膝彎約60度、小腿垂直地面，靜止用力。喚醒股四頭肌並降低疼痛敏感度，不磨損軟骨。"],
spanish:["彈力帶西班牙深蹲","彈力帶固定於低處、套在膝窩下方，向後坐使小腿保持垂直。大腿前側全力出力，髕骨擠壓最小。"],
box:["椅子深蹲（Tempo）","屁股輕碰椅子立即站起。節奏：下3秒、停1秒、上3秒。用時間取代重量刺激肌腱。"],
step:["單腳階梯下踩","站在階梯上，另一腳慢速下探輕碰地面。骨盆水平、膝蓋對準第二腳趾不內扣，下沉3秒。"],
rdl:["單腳羅馬尼亞硬舉","單腳站立，上身前傾、後腳抬起成一直線，下3秒上2秒。骨盆朝向正前方，強化後側鏈與平衡。"],
bulg:["保加利亞分腿蹲","後腳搭椅子，前小腿盡量垂直、屁股向後坐，力量集中於臀部，下3秒上2秒。"],
sbr:["單腳臀橋","仰躺單腳踩地，抬起臀部至頂點收縮，骨盆保持水平。強化臀部吸震能力。"],
calf:["單腳提踵","前腳掌踩階梯邊緣，上提2秒、頂端停2秒、慢放3秒。強化腳踝與小腿緩衝。"],
ll:["側向跨步蹲","向側邊跨大步，蹲向跨出腳一側，另一腳伸直。重心偏向支撐腳髖部外側，膝蓋對準腳尖。深度依週次提升，建議佩戴髕骨帶。"],
bp:["彈力帶側拉單腳站立","彈力帶固定於身體側邊，單腳站立抵抗被側拉的力量，骨盆保持水平。直接訓練冠狀面動態穩定。"],
mon:["怪獸走路","彈力圈套膝上，微蹲後橫向移動，重心壓低、步伐緩慢，強化臀中肌。"],
sl:["側臥側抬腿","側躺，上腳慢速抬起2秒、慢放3秒，骨盆不可後倒，專練臀中肌離心控制。"],
lst:["側向走上階梯","側身站在階梯旁，外側腳踏上並站直，下降時慢放3秒。強化冠狀面離心控制。"],
sw:["彈力帶側跨步走","彈力圈套腳踝，微蹲側向跨步，維持低重心與穩定步伐。"],
pt:["單腳站立＋外力干擾","單腳站立時由彈力帶或旁人輕微側拉干擾，維持骨盆水平與膝蓋對位。進階可閉眼。"],
pal:["Pallof Press（抗旋轉）","彈力帶固定於身體側邊，雙手於胸前推出並抵抗側拉，停留2–3秒。訓練軀幹抗旋轉。"],
db:["死蟲式（Dead Bug）","仰躺屈膝90度，對角伸展手腳，腰部貼地、軀幹不晃動，訓練深層核心穩定。"],
bd:["鳥狗式（抗旋轉）","四足跪姿，伸出對側手腳並停留2秒，骨盆不傾斜、軀幹不旋轉。"],
sp:["側棒式","前臂撐地側身抬起，身體成一直線，強化體側與臀中肌，減少膝蓋內塌。"],
pr:["棒式＋旋轉點地","平板支撐，單手輪流點對側肩，骨盆不晃動。"],
bj:["雙腳跳上台階","高度30公分，跳上後走下來，不跳下。只有起跳出力、無高衝擊落地，屬低衝擊跳躍。"],
dl:["階梯下落緩衝著地","從15公分階梯落下，胸口前傾、屁股後坐、落地無聲，定住2秒。僅維持量，不求量多。"],
cmj:["雙腳原地垂直起跳","跳躍約70%高度，落地深彎屁股吸震、安靜無聲。僅維持量。"]
};
const REC=[{n:"平地散步",d:"15分鐘",x:"步伐均勻對稱，不可跛行避痛。"},{n:"滾筒放鬆＋冰敷",d:"25分鐘",x:"大腿前後側、小腿、臀部外側放鬆，結束後冰敷15分鐘。"},{n:"監測紀錄",d:"約5分鐘",x:"記錄積水輕撫測試等級、單腳蹲疼痛分數、側蹲疼痛分數。不安排任何負重訓練。"}];
const T={
一:"冠狀面力量",二:"矢狀面力量＋核心",三:"純恢復＋監測",四:"冠狀面穩定＋抗旋轉",五:"整合",六:"週測試",日:"完全休息"
};
const P={
1:{note:"第1週・組織耐受：淺角度（約45°）、慢速、無任何落地訓練。側向訓練建議佩戴髕骨帶。",
 一:[["wall","3組 × 45秒"],["ll","3組 × 8次/側（淺蹲45°）"],["bp","3組 × 30秒/側"],["mon","4組 × 20步"],["sl","3組 × 15次/側"]],
 二:[["wall","2組 × 45秒"],["box","4組 × 12次"],["step","3組 × 10次/側（10公分）"],["rdl","3組 × 10次/側（自重）"],["db","3組 × 10次/側"],["sp","3組 × 30秒/側"]],
 四:[["spanish","3組 × 45秒"],["sw","3組 × 15步/側"],["pt","3組 × 30秒/側"],["pal","3組 × 10次/側"],["bd","3組 × 10次/側"]],
 五:[["wall","2組 × 45秒"],["lst","3組 × 10次/側（10公分）"],["sbr","3組 × 12次/側"],["calf","3組 × 12次/側"],["pr","3組 × 8次/側"]],
 六:["積水輕撫測試 — 維持 0 級或 Trace","側向跨步蹲（淺角度、戴帶）連續10次 — 疼痛 ≤ 2分","隔日晨起單腳蹲 — 疼痛不比前一天增加"]},
2:{note:"第2週・增加深度：側蹲加深至約50°，開始單腳負荷；僅1次低衝擊跳躍（跳上台階）。",
 一:[["wall","2組 × 45秒"],["ll","3組 × 8次/側（約50°、下3秒）"],["bp","3組 × 40秒/側"],["mon","4組 × 20步"],["sl","3組 × 15次/側（加彈力圈）"]],
 二:[["spanish","3組 × 45秒"],["box","4組 × 12次（約60°）"],["step","3組 × 12次/側（15公分）"],["rdl","3組 × 10次/側（2公斤）"],["db","3組 × 10次/側"],["sp","3組 × 40秒/側"]],
 四:[["spanish","3組 × 45秒"],["sw","3組 × 15步/側"],["pt","3組 × 30秒/側（加大干擾）"],["pal","3組 × 10次/側（停2秒）"],["bd","3組 × 10次/側"]],
 五:[["wall","2組 × 45秒"],["lst","3組 × 10次/側（15公分）"],["sbr","3組 × 12次/側（頂點停2秒）"],["calf","4組 × 12次/側"],["bj","2組 × 6次"],["pr","3組 × 10次/側"]],
 六:["積水輕撫測試 — 0 級","30秒單腳坐到站 — 患側達健側 80% 以上","側向跨步蹲（約50°）連續10次 — 疼痛 ≤ 2分、膝蓋不內扣"]},
3:{note:"第3週・離心負重：加入背包或水瓶負重；側蹲下蹲4秒；導入落地緩衝（維持量，僅週五）。",
 一:[["wall","2組 × 45秒"],["ll","4組 × 8次/側（約60°、下4秒）"],["bp","3組 × 40秒/側"],["mon","4組 × 20步"],["sl","3組 × 15次/側"]],
 二:[["spanish","3組 × 45秒"],["box","4組 × 12次（手持3–5公斤）"],["step","3組 × 12次/側（15–20公分）"],["rdl","3組 × 10次/側（5公斤）"],["db","3組 × 10次/側"],["sp","3組 × 40秒/側"]],
 四:[["spanish","3組 × 45秒"],["lst","3組 × 10次/側（20公分）"],["pt","3組 × 20秒/側（閉眼）"],["pal","3組 × 10次/側（停3秒）"],["bd","3組 × 10次/側"]],
 五:[["wall","2組 × 45秒"],["bulg","3組 × 8次/側"],["sbr","3組 × 12次/側"],["bj","2組 × 6次"],["dl","2組 × 6次"],["pr","3組 × 10次/側"]],
 六:["積水輕撫測試 — 0 級","側向跨步蹲（約60°）連續10次 — 疼痛 ≤ 2分","單腳蹲45° 連續10次 — 疼痛 ≤ 2分、無晃動","隔日晨起單腳蹲 — 無延遲疼痛增加"]},
4:{note:"第4週・整合：衝擊訓練維持在低量（2組×6次），最後一組側蹲可試做無帶，疼痛 ≤ 2分才繼續。",
 一:[["wall","2組 × 45秒"],["ll","4組 × 8次/側（約60°，最後1組可試無帶）"],["bp","3組 × 40秒/側"],["mon","4組 × 20步"],["sl","3組 × 15次/側"]],
 二:[["bulg","3組 × 10次/側"],["box","4組 × 12次（5公斤）"],["step","3組 × 12次/側（20公分）"],["rdl","3組 × 10次/側（8公斤）"],["db","3組 × 10次/側"],["sp","3組 × 45秒/側"]],
 四:[["spanish","3組 × 45秒"],["lst","3組 × 10次/側（20公分）"],["pt","3組 × 20秒/側（閉眼）"],["pal","3組 × 10次/側（停3秒）"],["bd","3組 × 10次/側"]],
 五:[["wall","2組 × 45秒"],["sbr","3組 × 12次/側"],["dl","2組 × 6次"],["cmj","2組 × 6次"],["calf","4組 × 12次/側"],["pr","3組 × 10次/側"]],
 六:["積水輕撫測試 — 0 級","無髕骨帶、正常深度側向跨步蹲連續10次 — 疼痛 ≤ 1分","30秒單腳坐到站 — 患側達健側 90% 以上","隔日晨起單腳蹲 — 無延遲疼痛增加","達標 → 再逐步回升排球與衝擊訓練量；未達標 → 重複第4週，若矢狀面疼痛未逐漸減少建議回診複查"]}
};
let w=1,d=DAYS[(new Date().getDay()+6)%7];
function esc(s){return s}
function render(){
  wk.innerHTML="";dy.innerHTML="";
  [1,2,3,4].forEach(n=>{const b=document.createElement("div");b.className="chip"+(n===w?" on":"");b.textContent="第 "+n+" 週";b.onclick=()=>{w=n;render()};wk.appendChild(b)});
  DAYS.forEach(n=>{const b=document.createElement("div");b.className="chip day"+(n===d?" on":"");b.textContent="週"+n;b.onclick=()=>{d=n;render()};dy.appendChild(b)});
  const rest=d==="日",rec=d==="三",test=d==="六";
  let h='<div class="card"><h2>第 '+w+' 週 · 週'+d+'</h2><span class="tag'+(rest||rec?' w':'')+'">'+T[d]+'</span><p class="note">'+P[w].note+'</p>';
  if(rest){h+='<p class="note">今日完全休息，記錄整週疼痛與積水變化。</p>'}
  else if(test){h+='<ul class="tl">'+P[w][d].map(t=>'<li>'+t+'</li>').join("")+'</ul>'}
  else{
    const items=rec?REC.map(r=>[r.n,r.d,r.x]):P[w][d].map(([k,dose])=>[L[k][0],dose,L[k][1]]);
    items.forEach(([n,ds,x])=>{h+='<div class="ex"><div class="eh"><span class="en">'+n+'</span><span class="ed">'+ds+'</span></div><details><summary>動作說明</summary><p class="desc">'+x+'</p></details></div>'});
  }
  out.innerHTML=h+'</div>';
}
render();
</script>
</body>
</html>
